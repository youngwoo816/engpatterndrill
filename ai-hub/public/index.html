<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 22l7-12 7 12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">AI Hub</div>
    <nav class="tabs" id="tabs">
      <button data-tab="claude" class="tab">Claude Code <span class="dot" id="h-claude"></span></button>
      <button data-tab="codex" class="tab">Codex <span class="dot" id="h-codex"></span></button>
      <button data-tab="all" class="tab">전체</button>
    </nav>
    <div class="conn" id="conn" title="서버 연결 상태">●</div>
  </header>

  <div class="layout">
    <aside class="side" id="side">
      <button class="btn primary block" id="btn-new">+ 새 작업</button>
      <div class="filters">
        <select id="filter-status" aria-label="상태 필터">
          <option value="">모든 상태</option>
          <option value="active">진행·대기</option>
          <option value="done">완료</option>
          <option value="failed">실패·중지</option>
        </select>
      </div>
      <div id="task-list" class="list"></div>
      <details class="local" id="local-box">
        <summary>PC의 기존 세션 <span class="muted">(터미널에서 실행한 작업)</span></summary>
        <div id="local-list" class="list"></div>
      </details>
    </aside>

    <main class="main" id="main">
      <section id="view-empty" class="empty">
        <h2>작업을 선택하거나 새로 만드세요</h2>
        <p class="muted">왼쪽 목록에서 작업을 고르면 진행 로그와 결과를 볼 수 있습니다.</p>
        <div id="health-box" class="health"></div>
      </section>

      <section id="view-new" class="card hidden">
        <h2>새 작업</h2>
        <form id="form-new">
          <div class="row">
            <label>AI
              <select name="agent">
                <option value="claude">Claude Code</option>
                <option value="codex">Codex</option>
              </select>
            </label>
            <label>권한
              <select name="mode" class="mode-select"></select>
            </label>
          </div>
          <label>작업 폴더 (절대 경로)
            <input name="cwd" list="cwd-list" placeholder="예: C:\projects\my-app 또는 /Users/me/my-app" required autocomplete="off" />
            <datalist id="cwd-list"></datalist>
          </label>
          <label>프롬프트
            <textarea name="prompt" rows="8" placeholder="무엇을 할지 구체적으로 적어주세요" required></textarea>
          </label>
          <div class="row end">
            <span class="muted small">Ctrl/⌘ + Enter로 실행</span>
            <button type="button" class="btn" id="btn-cancel-new">취소</button>
            <button type="submit" class="btn primary">실행</button>
          </div>
          <p class="error" id="new-error"></p>
        </form>
      </section>

      <section id="view-task" class="task hidden">
        <div class="task-head">
          <button class="btn ghost back" id="btn-back" aria-label="목록으로">←</button>
          <div class="grow">
            <h2 id="t-title"></h2>
            <div class="meta" id="t-meta"></div>
          </div>
          <div class="actions">
            <button class="btn danger" id="btn-stop">중지</button>
            <button class="btn ghost" id="btn-delete" title="목록에서 삭제">삭제</button>
          </div>
        </div>
        <nav class="subtabs" id="subtabs">
          <button data-sub="log" class="active">진행 로그</button>
          <button data-sub="result">결과</button>
          <button data-sub="diff">변경 파일</button>
        </nav>
        <div class="pane" id="pane-log"></div>
        <div class="pane hidden" id="pane-result"></div>
        <div class="pane hidden" id="pane-diff"></div>
        <form class="composer" id="form-follow">
          <textarea name="prompt" rows="2" placeholder="이어서 지시하기 (같은 세션으로 이어집니다)"></textarea>
          <div class="composer-bar">
            <select name="mode" class="mode-select" aria-label="권한"></select>
            <button class="btn primary" type="submit">전송</button>
          </div>
          <p class="error" id="follow-error"></p>
        </form>
      </section>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
