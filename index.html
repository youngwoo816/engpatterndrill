<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rep English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<meta name="description" content="일상·여행·비즈니스 영어 회화 패턴 1,392문장을 듣기→따라 말하기→조립→바꿔 말하기→회상 단계로 반복 훈련하는 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 손 모바일 앱 — 상단 요약, 카드 스택, 하단 탭바. 드릴은 전체 화면 오버레이(상단 진행·이동 → 본문 → 하단 큰 버튼). */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --sunken:#E4E9E3; --ink:#15201B; --muted:#5B6862; --line:#D3DBD5;
  --accent:#2747D9; --accent-ink:#FFFFFF; --accent-soft:#DFE5FF;
  --flame:#D9631A; --flame-soft:#FBE4D3; --good:#11865E; --good-soft:#D8F1E6; --warn:#B47A00; --warn-soft:#FBEFCF; --bad:#C93B3B; --bad-soft:#F8DEDE;
  --heat0:#E1E7E2; --heat1:#C3CDF7; --heat2:#8EA1F0; --heat3:#5670E4; --heat4:#2747D9;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 6px 20px rgba(20,32,27,.06);
  --f-en:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1210; --surface:#161D1A; --sunken:#1D2622; --ink:#E7EDE9; --muted:#95A39C; --line:#2A3631;
  --accent:#8299FF; --accent-ink:#0D1210; --accent-soft:#1F2850;
  --flame:#FF9A55; --flame-soft:#3A2412; --good:#3FCB95; --good-soft:#123227; --warn:#E8B53A; --warn-soft:#352A0D; --bad:#FF7A7A; --bad-soft:#3A1818;
  --heat0:#1E2824; --heat1:#25335E; --heat2:#34488F; --heat3:#5670E4; --heat4:#8299FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1210; --surface:#161D1A; --sunken:#1D2622; --ink:#E7EDE9; --muted:#95A39C; --line:#2A3631;
  --accent:#8299FF; --accent-ink:#0D1210; --accent-soft:#1F2850;
  --flame:#FF9A55; --flame-soft:#3A2412; --good:#3FCB95; --good-soft:#123227; --warn:#E8B53A; --warn-soft:#352A0D; --bad:#FF7A7A; --bad-soft:#3A1818;
  --heat0:#1E2824; --heat1:#25335E; --heat2:#34488F; --heat3:#5670E4; --heat4:#8299FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ko);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.en{font-family:var(--f-en)}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-ko);font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}

/* top */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-en);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1}
.brand b{color:var(--accent)}
.top-r{display:flex;gap:8px;align-items:center}
.streak{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--surface);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);height:36px}
.streak svg{width:16px;height:16px;fill:var(--flame)}
.streak.off svg{fill:var(--line)}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:18px;height:18px;fill:var(--ink)}

/* today strip */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.today > div{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.today .n{font-family:var(--f-mono);font-weight:600;font-size:20px}
.today .l{font-size:12px;color:var(--muted)}

/* category cards */
.cat{display:flex;flex-direction:column;gap:12px}
.cat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cat h2{font-size:19px}
.cat .en-sub{font-family:var(--f-en);font-weight:600;color:var(--muted);font-size:13px}
.daytag{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--sunken);border-radius:8px;padding:4px 8px;white-space:nowrap}
.daytag.done{background:var(--good-soft);color:var(--good)}
.bar{height:8px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.goal i{background:var(--good)}
.next{font-size:13px;color:var(--muted);display:flex;gap:6px;min-width:0}
.next .en{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink);min-height:48px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--sunken);color:var(--ink)}
.btn svg{width:16px;height:16px;fill:currentColor;flex:none}
.btn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 35%, transparent)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:38px;padding:8px 12px;font-size:13px;border-radius:10px}
.review-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft)}
.review-card .n{font-family:var(--f-mono);font-weight:600;font-size:22px;color:var(--accent)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:600}
.tabbar a svg{width:22px;height:22px;fill:currentColor}
.tabbar a[aria-current="page"]{color:var(--accent)}

/* progress page */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .n{font-family:var(--f-mono);font-size:24px;font-weight:600}
.stat .n small{font-size:13px;color:var(--muted);font-weight:500}
.stat .l{font-size:12px;color:var(--muted)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;width:max-content}
.heat span{width:14px;height:14px;border-radius:3px;background:var(--heat0)}
.heat span[data-l="1"]{background:var(--heat1)}.heat span[data-l="2"]{background:var(--heat2)}.heat span[data-l="3"]{background:var(--heat3)}.heat span[data-l="4"]{background:var(--heat4)}
.heat span.today{box-shadow:0 0 0 1.5px var(--ink)}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend span{width:11px;height:11px;border-radius:2px}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.daygrid span{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--sunken);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.daygrid span.done{background:var(--accent);color:var(--accent-ink);font-weight:600}
.daygrid span.part{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--sunken);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.log{display:flex;flex-direction:column}
.log > div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.log > div:last-child{border-bottom:0}
.check{width:22px;height:22px;border-radius:50%;background:var(--good);display:flex;align-items:center;justify-content:center}
.check svg{width:14px;height:14px;fill:#fff}

/* patterns page */
.pat{border-bottom:1px solid var(--line)}
.pat:last-child{border-bottom:0}
.pat summary{list-style:none;cursor:pointer;padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.pat summary::-webkit-details-marker{display:none}
.pat .pt{font-family:var(--f-en);font-weight:700;font-size:16px;min-width:0}
.pat .pk{font-size:13px;color:var(--muted);grid-column:1}
.pat .dots{grid-row:1/3;grid-column:2;display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.pat-acts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.sent{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0 8px 2px}
.sent .en{font-weight:600;font-size:15px}
.sent .ko{grid-column:2;font-size:13px;color:var(--muted)}
.play{width:34px;height:34px;border-radius:50%;background:var(--sunken);display:flex;align-items:center;justify-content:center;grid-row:1/3;flex:none}
.play svg{width:14px;height:14px;fill:var(--ink)}
.sec-title{font-weight:700;font-size:13px;color:var(--accent);margin:18px 0 0}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row > div:first-child{min-width:0;flex:1 1 160px}
.set-row .t{font-weight:600}
.set-row .d{font-size:12px;color:var(--muted)}
.set-row .seg{flex:1 1 200px}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:220px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--sunken);font-size:20px;font-weight:700;line-height:1}
.stepper input{width:64px;height:40px;text-align:center;font-family:var(--f-mono);font-size:17px;font-weight:600;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{width:100%;font-family:var(--f-mono);font-size:12px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:calc(100% - 32px);text-align:center}

/* DRILL OVERLAY */
.drill{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.dr-top{padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.dr-top .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.x{width:36px;height:36px;border-radius:50%;background:var(--sunken);display:flex;align-items:center;justify-content:center;flex:none}
.x svg{width:16px;height:16px;fill:var(--ink)}
.navrow{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px;min-width:0}
.nav{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:34px;padding:0 10px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:600;white-space:nowrap}
.nav svg{width:15px;height:15px;fill:currentColor}
.nav[disabled]{opacity:.4;pointer-events:none}
.nav.pat-next{color:var(--accent)}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.steps span{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-top:6px;border-top:3px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps span.on{color:var(--accent);border-color:var(--accent)}
.steps span.past{color:var(--ink);border-color:var(--ink)}
.dr-body{flex:1;overflow-y:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.dr-body .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.dr-foot{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
.dr-foot .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.dr-foot .btn{flex:1}
.patchip{display:flex;flex-direction:column;gap:2px;background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.patchip .p{font-family:var(--f-en);font-weight:700;color:var(--accent);font-size:15px}
.patchip .k{font-size:13px}
.patchip .tip{font-size:12px;color:var(--muted)}
.big{font-family:var(--f-en);font-weight:700;font-size:clamp(24px,6.6vw,32px);line-height:1.3;letter-spacing:-.01em;word-break:break-word}
.big mark{background:none;color:var(--accent);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--accent-soft)}
.ko-line{font-size:16px;color:var(--muted)}
.audio-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:14px}
.pill svg{width:14px;height:14px;fill:currentColor}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.pill.acc{color:var(--accent)}
.rounds{display:flex;gap:6px;align-items:center}
.rounds i{width:28px;height:6px;border-radius:9px;background:var(--line)}
.rounds i.done{background:var(--good)}
.rounds i.cur{background:var(--accent)}
.mask{color:transparent;background:var(--sunken);border-radius:5px;box-shadow:inset 0 -2px 0 var(--line)}
.peek .mask{color:var(--muted);background:transparent;box-shadow:none}
.hintbox{font-size:12px;color:var(--muted)}
.answer{min-height:64px;background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.answer.ok{box-shadow:inset 0 0 0 2px var(--good);background:var(--good-soft)}
.answer.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-en);font-weight:600;font-size:17px;padding:8px 12px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);min-height:42px}
.chip.used{visibility:hidden}
.chip.wrong{background:var(--bad-soft);color:var(--bad)}
.input{width:100%;font-family:var(--f-en);font-size:19px;font-weight:600;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:none}
.result .w{font-family:var(--f-en);font-weight:700;font-size:22px;line-height:1.5}
.result .miss{color:var(--bad);text-decoration:underline wavy;text-decoration-thickness:1.5px;text-underline-offset:4px}
.score{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-weight:700;border-radius:8px;padding:4px 10px;font-size:13px}
.score.g{background:var(--good-soft);color:var(--good)}.score.m{background:var(--warn-soft);color:var(--warn)}.score.b{background:var(--bad-soft);color:var(--bad)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.grade button{border-radius:12px;padding:12px 4px;font-weight:700;font-size:14px;min-height:56px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.grade button small{font-weight:500;font-size:11px;opacity:.8}
.grade button.sug{box-shadow:inset 0 0 0 2px currentColor}
.g-again{background:var(--bad-soft);color:var(--bad)}.g-ok{background:var(--warn-soft);color:var(--warn)}.g-good{background:var(--good-soft);color:var(--good)}

/* swap (바꿔 말하기) */
.sc0{--sc:var(--accent);--scs:var(--accent-soft)}
.sc1{--sc:var(--flame);--scs:var(--flame-soft)}
.sc2{--sc:var(--good);--scs:var(--good-soft)}
.slotw{color:var(--sc);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--scs)}
.slot{display:flex;flex-direction:column;gap:6px}
.slot-l{font-size:12px;font-weight:700;color:var(--sc)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--f-en);font-weight:600;font-size:15px;min-height:38px}
.opt[aria-pressed="true"]{background:var(--scs);color:var(--sc);box-shadow:inset 0 0 0 2px var(--sc)}
.made{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.made i{width:22px;height:6px;border-radius:9px;background:var(--line)}
.made i.on{background:var(--good)}
.madelist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.madelist .en{font-weight:600}

/* examples (예문 10) */
.exlist{display:flex;flex-direction:column}
.ex{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;padding:10px 4px;border-bottom:1px solid var(--line);border-radius:10px;cursor:pointer}
.ex:last-child{border-bottom:0}
.ex.cur{background:var(--accent-soft)}
.ex .tag{grid-column:2;justify-self:start;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px}
.ex.cur .tag{background:var(--surface)}
.ex .en{grid-column:2;font-family:var(--f-en);font-weight:600;font-size:17px;line-height:1.35}
.ex .ko{grid-column:2;font-size:13px;color:var(--muted)}
.ex .play{grid-row:1/4}
.exlist.h-en .ex:not(.show) .en,.exlist.h-ko .ex:not(.show) .ko{color:transparent;background:var(--sunken);border-radius:6px;user-select:none}
.ex-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* back navigation */
.backbar{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:6px 12px 6px 4px;margin:-6px 0 10px -4px;border-radius:12px;color:var(--accent);font-weight:700;font-size:15px}
.backbar svg{width:20px;height:20px;fill:currentColor}
.backbar:active{background:var(--accent-soft)}
.backbtn{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 12px 0 6px;border-radius:18px;background:var(--sunken);font-weight:700;font-size:14px;flex:none}
.backbtn svg{width:18px;height:18px;fill:currentColor}

/* list sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:640px;max-height:86%;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-b{overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.jump{display:grid;grid-template-columns:18px 1fr;gap:2px 8px;width:100%;text-align:left;padding:8px 6px;border-radius:10px}
.jump.cur{background:var(--accent-soft)}
.jump .en{font-weight:600;font-size:14px}
.jump .ko{grid-column:2;font-size:12px;color:var(--muted)}
.jump .mk{width:14px;height:14px;border-radius:50%;margin-top:3px;background:var(--line)}
.jump .mk.on{background:var(--good)}
.patjump{font-family:var(--f-en);font-weight:700;font-size:13px;color:var(--accent);padding:6px 0;text-align:left}

.done-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:24px}
.done-hero .stamp{width:120px;height:120px;border-radius:50%;border:4px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);color:var(--accent)}
.done-hero .stamp b{font-family:var(--f-en);font-size:34px;font-weight:800;line-height:1}
.done-hero .stamp span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.empty{text-align:center;padding:40px 0;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="drill" class="drill" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
"use strict";
/* ---------- constants ---------- */
const CATS = [
  { key:"daily",    file:"data/daily.txt",    swap:"data/swap-daily.txt", forms:"data/forms-daily.txt",    ko:"일상 대화",     en:"Everyday Talk",  pre:"d" },
  { key:"travel",   file:"data/travel.txt",   swap:"data/swap-travel.txt", forms:"data/forms-travel.txt",   ko:"여행 영어",     en:"Travel English", pre:"t" },
  { key:"business", file:"data/business.txt", swap:"data/swap-business.txt", forms:"data/forms-business.txt", ko:"비즈니스 영어", en:"Work & Office",  pre:"b" },
];
const NEXT_LABEL = { build:"조립으로", swap:"바꿔 말하기로", recall:"회상으로" };
const STEP_LABEL = { listen:"듣기", shadow:"따라 말하기", build:"조립", swap:"바꿔 말하기", recall:"회상" };
const SRS = [1,2,4,7,15,30,60];
const SWAP_MIN = 3;
const LS_KEY = "rep-english-v1";
const ICON = {
  play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>',
  slow:'<svg viewBox="0 0 24 24"><path d="M3 5h3v14H3zM9 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 9 5.5z"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M18.3 5.7a1 1 0 0 0-1.4 0L12 10.6 7.1 5.7a1 1 0 1 0-1.4 1.4L10.6 12l-4.9 4.9a1 1 0 1 0 1.4 1.4L12 13.4l4.9 4.9a1 1 0 0 0 1.4-1.4L13.4 12l4.9-4.9a1 1 0 0 0 0-1.4z"/></svg>',
  flame:'<svg viewBox="0 0 24 24"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 11 11c0-4 1-9 1-9z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6L21 7.5l-1.4-1.4z"/></svg>',
  learn:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm4 2v2h8V7zm0 4v2h8v-2zm0 4v2h5v-2z"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M4 20h16v-2H4zM6 16h3V9H6zm5 0h3V4h-3zm5 0h3v-5h-3z"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M4 6h2v2H4zm4 0h12v2H8zM4 11h2v2H4zm4 0h12v2H8zm-4 5h2v2H4zm4 0h12v2H8z"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3zm2 15a1 1 0 0 0 1 1h9v-2H8a1 1 0 0 0-1 1zM8 6v2h8V6zm0 4v2h6v-2z"/></svg>',
  stop:'<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.6.1-1.1-.1-1.1 2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.9-1.1L15.8 3h-3.9l-.4 2.7a8 8 0 0 0-1.9 1.1l-2.4-1-2 3.4 2 1.6-.1 1.1.1 1.1-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.9 1.1l.4 2.7h3.9l.4-2.7a8 8 0 0 0 1.9-1.1l2.4 1 2-3.4z"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M8.6 18.6 10 20l8-8-8-8-1.4 1.4 6.6 6.6z"/></svg>',
  skip:'<svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6zm9-12v12l8.5-6z"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>',
  moon:'<svg viewBox="0 0 24 24"><path d="M20.7 14.6A8.5 8.5 0 0 1 9.4 3.3 8.5 8.5 0 1 0 20.7 14.6z"/></svg>'
};

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dstr = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const [y,m,d] = s.split("-").map(Number); const t = new Date(y,m-1,d); t.setDate(t.getDate()+n); return dstr(t); };
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }

/* ---------- storage ---------- */
const DEFAULT = { v:2, settings:{ daily:10, rate:1, auto:true, accent:"us", voiceUS:"", voiceGB:"", theme:"system" }, learned:{}, sessions:[], activity:{}, newBy:{} };
let S = load();
function normalize(o){
  const s = { ...JSON.parse(JSON.stringify(DEFAULT)), ...o };
  s.settings = { ...DEFAULT.settings, ...(o.settings||{}) };
  s.settings.daily = clamp(parseInt(s.settings.daily,10)||10, 1, 50);
  s.settings.rate = clamp(+s.settings.rate || 1, .8, 1);
  s.newBy = s.newBy || {}; s.activity = s.activity || {}; s.sessions = s.sessions || []; s.learned = s.learned || {};
  return s;
}
function load(){ try { const raw = localStorage.getItem(LS_KEY); if (raw) return normalize(JSON.parse(raw)); } catch(e){} return normalize({}); }
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- theme ---------- */
let ownTheme = false;
function applyTheme(){
  const r = document.documentElement, t = S.settings.theme;
  if (t === "light" || t === "dark") { r.setAttribute("data-theme", t); ownTheme = true; }
  else if (ownTheme) { r.removeAttribute("data-theme"); ownTheme = false; }
}
function isDark(){ const a = document.documentElement.getAttribute("data-theme"); if (a) return a === "dark"; return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches; }
applyTheme();

/* ---------- data ---------- */
const DATA = {};
const BYID = {};
function parse(text, cat){
  const out = { sections:[], patterns:[], list:[] };
  let sec = null, pat = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    if (line.startsWith("## ")) {
      const [p,k,tip] = line.slice(3).split("|").map(s=>s.trim());
      if (!sec) { sec = { name:"", patterns:[] }; out.sections.push(sec); }
      pat = { p, k:k||"", tip:tip||"", items:[], sec:sec.name, idx:out.patterns.length, cat:cat.key, sw:null };
      sec.patterns.push(pat); out.patterns.push(pat);
    } else if (line.startsWith("# ")) {
      sec = { name:line.slice(2).trim(), patterns:[] }; out.sections.push(sec);
    } else if (pat) {
      const i = line.indexOf(" | "); if (i<0) continue;
      const s = { id: cat.pre + out.list.length, idx: out.list.length, cat:cat.key, en:line.slice(0,i).trim(), ko:line.slice(i+3).trim(), pat };
      pat.items.push(s); out.list.push(s);
    }
  }
  return out;
}
function parseSwap(text, D){
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line || line.startsWith("#")) continue;
    const parts = line.split(" | "); if (parts.length < 4) continue;
    const pat = D.patterns[parseInt(parts[0],10)-1]; if (!pat) continue;
    const slots = parts[3].split(";;").map(s => {
      const c = s.indexOf(":");
      return { label: s.slice(0,c).trim(), opts: s.slice(c+1).split(" / ").map(o => { const j = o.indexOf("="); return { en:o.slice(0,j).trim(), ko:o.slice(j+1).trim() }; }).filter(o => o.en && o.ko) };
    }).filter(s => s.opts.length);
    if (slots.length) pat.sw = { en:parts[1].trim(), ko:parts[2].trim(), slots };
  }
}
function parseForms(text, D){
  let cur = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line || line.startsWith("#")) continue;
    if (line.startsWith("@")) { cur = D.patterns[parseInt(line.slice(1),10)-1] || null; if (cur) cur.ex = []; continue; }
    if (!cur) continue;
    const parts = line.split(" | "); if (parts.length !== 3) continue;
    cur.ex.push({ tag:parts[0].trim(), en:parts[1].trim(), ko:parts[2].trim() });
  }
}
async function loadData(){
  await Promise.all(CATS.map(async c => {
    const r = await fetch(c.file); if (!r.ok) throw new Error(c.file);
    const D = DATA[c.key] = parse(await r.text(), c);
    D.list.forEach(s => BYID[s.id] = s);
    try { const w = await fetch(c.swap); if (w.ok) parseSwap(await w.text(), D); } catch(e){}
    try { const f = await fetch(c.forms); if (f.ok) parseForms(await f.text(), D); } catch(e){}
  }));
}

/* ---------- speech (미국/영국 발음, 기계음 제외) ---------- */
const ROBOTIC = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Bruce|Agnes|Vicki|Victoria|Princess|Deranged|Hysterical|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b|espeak|festival|mbrola|pico/i;
const TTS = { ok: "speechSynthesis" in window, us:[], gb:[] };
function vScore(v){
  let s = 0;
  if (/natural|neural|online/i.test(v.name)) s += 4;
  if (/enhanced|premium|siri/i.test(v.name)) s += 3;
  if (/google/i.test(v.name)) s += 2;
  if (/samantha|daniel|serena|kate|arthur|martha|ava|allison|susan|aria|jenny|guy|libby|sonia|ryan|zoe|evan|nathan|tom/i.test(v.name)) s += 1;
  return s;
}
function pickVoices(){
  if (!TTS.ok) return;
  const all = speechSynthesis.getVoices().filter(v => !ROBOTIC.test(v.name));
  const of = tag => all.filter(v => v.lang.replace("_","-").toLowerCase() === tag).sort((a,b) => vScore(b) - vScore(a));
  TTS.us = of("en-us"); TTS.gb = of("en-gb");
}
if (TTS.ok){ pickVoices(); speechSynthesis.onvoiceschanged = () => { pickVoices(); if (route()==="more" && dr().hidden) render(); }; }
function curVoice(){
  const acc = S.settings.accent, list = TTS[acc] || [];
  const want = acc === "gb" ? S.settings.voiceGB : S.settings.voiceUS;
  return list.find(v => v.name === want) || list[0] || null;
}
function mkUtter(text, mult=1){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = S.settings.accent === "gb" ? "en-GB" : "en-US";
  u.rate = clamp(S.settings.rate * mult, .5, 1.2);
  const v = curVoice(); if (v) u.voice = v;
  return u;
}
function speak(text, mult=1){
  if (!TTS.ok) return;
  try { speechSynthesis.cancel(); speechSynthesis.speak(mkUtter(text, mult)); } catch(e){}
}
function speakList(texts, onStart, onDone){
  if (!TTS.ok || !texts.length) return;
  try {
    speechSynthesis.cancel();
    texts.forEach((t, i) => {
      const u = mkUtter(t);
      u.onstart = () => onStart && onStart(i);
      if (i === texts.length - 1) u.onend = () => onDone && onDone();
      speechSynthesis.speak(u);
    });
  } catch(e){}
}
const accLabel = () => S.settings.accent === "gb" ? "영국 발음" : "미국 발음";

/* ---------- progress logic ---------- */
const today = () => dstr();
function learnedIn(cat){ return DATA[cat].list.filter(s => S.learned[s.id]).length; }
function firstUnlearned(cat){ const i = DATA[cat].list.findIndex(s => !S.learned[s.id]); return i < 0 ? 0 : i; }
function todayNew(cat){ return (S.newBy[today()] || {})[cat] || 0; }
function doneToday(cat){ return S.sessions.some(x => x.cat===cat && x.date===today()); }
function dayNo(cat){ const n = S.sessions.filter(x => x.cat===cat).length; return doneToday(cat) ? n : n + 1; }
function dueList(){ const t = today(); return Object.keys(S.learned).filter(id => BYID[id] && S.learned[id].due <= t).map(id => BYID[id]); }
function streak(){
  const days = new Set(S.sessions.map(x => x.date));
  let d = today(); if (!days.has(d)) d = addDays(d,-1);
  let n = 0; while (days.has(d)) { n++; d = addDays(d,-1); }
  return n;
}
function logActivity(n=1){ const t = today(); S.activity[t] = (S.activity[t]||0) + n; }
function addNew(cat){ const t = today(); S.newBy[t] = S.newBy[t] || {}; S.newBy[t][cat] = (S.newBy[t][cat]||0) + 1; }
function checkClear(cat){
  if (doneToday(cat) || todayNew(cat) < S.settings.daily) return false;
  S.sessions.push({ date:today(), cat, day:S.sessions.filter(x=>x.cat===cat).length+1, n:todayNew(cat) });
  return true;
}
function grade(id, g){ // g: 0 다시, 1 애매, 2 완벽
  const cur = S.learned[id];
  let box;
  if (!cur) box = g===2 ? 1 : 0;
  else box = g===0 ? 0 : g===1 ? cur.box : Math.min(cur.box+1, SRS.length-1);
  S.learned[id] = { t: cur ? cur.t : today(), box, due: addDays(today(), g===0 ? 1 : SRS[box]), g };
}

/* ---------- routing ---------- */
const TABS = [["learn","학습",ICON.learn],["examples","예문",ICON.book],["progress","진척도",ICON.chart],["patterns","문장 목록",ICON.list],["more","설정",ICON.gear]];
function route(){ const h = location.hash.slice(1); return TABS.some(t=>t[0]===h) ? h : "learn"; }
window.addEventListener("hashchange", () => {
  const r = route();
  if (r !== "examples") backTo = null;
  if (r === "patterns" && openPat) { patCat = openPat.cat; render(); restoreList(); }
  else { render(); window.scrollTo(0,0); }
});

function shell(inner){
  const r = route();
  return `<div class="wrap">${inner}</div>
  <div class="tabbar"><nav>${TABS.map(([k,l,ic]) => `<a href="#${k}" ${k===r?'aria-current="page"':''}>${ic}<span>${l}</span></a>`).join("")}</nav></div>`;
}
function topBar(sub){
  const st = streak(), dark = isDark();
  return `<div class="top"><div class="stack" style="gap:6px"><span class="eyebrow">${sub}</span><div class="brand">Rep<b>.</b>English</div></div>
  <div class="top-r"><button class="iconbtn" data-theme-toggle aria-label="${dark?'라이트 모드로 바꾸기':'다크 모드로 바꾸기'}" title="${dark?'라이트 모드':'다크 모드'}">${dark?ICON.sun:ICON.moon}</button>
  <div class="streak ${st?'':'off'}" title="연속 학습일">${ICON.flame}<span>${st}일</span></div></div></div>`;
}

/* ---------- views ---------- */
let patCat = "daily", progCat = "daily", query = "";
function render(){
  const r = route(), app = $("#app");
  if (r==="learn") app.innerHTML = shell(viewLearn());
  else if (r==="progress") app.innerHTML = shell(viewProgress());
  else if (r==="patterns") app.innerHTML = shell(viewPatterns());
  else if (r==="examples") app.innerHTML = shell(viewExamples());
  else app.innerHTML = shell(viewMore());
  bind(r);
}

function viewLearn(){
  const n = S.settings.daily, t = today();
  const todayCount = S.activity[t] || 0;
  const doneCats = CATS.filter(c => doneToday(c.key)).length;
  const due = dueList().length;
  const total = CATS.reduce((a,c)=>a+DATA[c.key].list.length,0);
  const learned = Object.keys(S.learned).length;
  let h = topBar(new Date().toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"}));
  h += `<div class="today">
    <div><div class="n">${todayCount}</div><div class="l">오늘 연습한 문장</div></div>
    <div><div class="n">${doneCats}<span class="muted" style="font-size:14px">/3</span></div><div class="l">오늘 완료한 Day</div></div>
    <div><div class="n">${learned}</div><div class="l">누적 / ${total.toLocaleString()}</div></div></div><div class="stack">`;
  if (due) h += `<div class="card review-card"><div class="stack" style="gap:2px"><b>복습할 문장</b><span class="muted" style="font-size:13px">간격 반복 일정상 오늘 다시 볼 차례예요</span></div>
    <div class="row"><span class="n">${due}</span><button class="btn" data-review>복습</button></div></div>`;
  for (const c of CATS){
    const D = DATA[c.key], L = learnedIn(c.key), pct = Math.round(L/D.list.length*100);
    const dn = doneToday(c.key), day = dayNo(c.key), tn = todayNew(c.key);
    const totalDays = Math.ceil(D.list.length / n);
    const allDone = L >= D.list.length;
    const nextS = D.list[firstUnlearned(c.key)];
    const label = allDone ? "처음부터 다시 보기" : dn ? "계속 학습하기" : tn > 0 ? `Day ${day} 이어서 하기` : `Day ${day} 시작`;
    h += `<div class="card cat">
      <div class="cat-head"><div class="stack" style="gap:2px"><h2>${c.ko}</h2><span class="en-sub">${c.en} · ${D.patterns.length}개 패턴 · ${D.list.length}문장</span></div>
      <span class="daytag ${dn?'done':''}">${dn ? `Day ${day} 완료 ✓` : `Day ${day}`}</span></div>
      <div class="stack" style="gap:6px">
        <div class="row between" style="font-size:12px"><span>오늘 목표</span><span class="mono">${Math.min(tn,n)} / ${n}문장</span></div>
        <div class="bar goal"><i style="width:${Math.min(100, tn/n*100)}%"></i></div>
        <div class="row between" style="font-size:12px;margin-top:4px"><span class="muted">전체 진도</span><span class="muted mono">${L} / ${D.list.length} (${pct}%) · 약 ${totalDays}일 과정</span></div>
        <div class="bar" style="height:6px"><i style="width:${pct}%"></i></div></div>
      ${!allDone ? `<div class="next"><span style="flex:none">다음 패턴</span><span class="en">${esc(nextS.pat.p)}</span></div>` : ''}
      <button class="btn ${dn?'ghost':''} block" data-start="${c.key}">${label}</button>
    </div>`;
  }
  h += `<p class="muted" style="font-size:12px;margin:4px 2px">한 문장 = 듣기 → 따라 말하기 2라운드 → 단어 조립 → 바꿔 말하기(패턴마다 1번) → 한국어 보고 영어로 말하기. 하루 목표만큼 새 문장을 마치면 그날이 Day로 기록돼요. 진도는 이 기기 브라우저에 저장됩니다.</p></div>`;
  return h;
}

function viewProgress(){
  const total = CATS.reduce((a,c)=>a+DATA[c.key].list.length,0);
  const learned = Object.keys(S.learned).length;
  const studyDays = new Set(S.sessions.map(x=>x.date)).size;
  const mastered = Object.values(S.learned).filter(x=>x.box>=3).length;
  let h = topBar("진척도");
  h += `<div class="stack"><div class="stats">
    <div class="stat"><div class="n">${learned}<small> / ${total}</small></div><div class="l">학습한 문장</div></div>
    <div class="stat"><div class="n">${streak()}<small>일</small></div><div class="l">연속 학습 (Day 완료 기준)</div></div>
    <div class="stat"><div class="n">${studyDays}<small>일</small></div><div class="l">Day를 완료한 날</div></div>
    <div class="stat"><div class="n">${mastered}</div><div class="l">장기 기억 문장 (복습 3회 이상 성공)</div></div></div>`;
  const weeks = 16, end = new Date(); const start = new Date(end); start.setDate(end.getDate() - end.getDay() - (weeks-1)*7);
  let cells = ""; const t = today();
  for (let i=0;i<weeks*7;i++){ const d = new Date(start); d.setDate(start.getDate()+i); const s = dstr(d); if (s > t) { cells += `<span style="visibility:hidden"></span>`; continue; }
    const v = S.activity[s]||0, l = v===0?0:v<6?1:v<11?2:v<21?3:4;
    cells += `<span data-l="${l}" class="${s===t?'today':''}" title="${s} · ${v}문장"></span>`; }
  h += `<div class="card stack"><div class="row between"><b>학습 기록</b><span class="muted" style="font-size:12px">최근 16주</span></div>
    <div class="heat-wrap"><div class="heat">${cells}</div></div>
    <div class="legend">적음 <span style="background:var(--heat0)"></span><span style="background:var(--heat1)"></span><span style="background:var(--heat2)"></span><span style="background:var(--heat3)"></span><span style="background:var(--heat4)"></span> 많음</div></div>`;
  const c = CATS.find(x=>x.key===progCat), D = DATA[c.key], n = S.settings.daily;
  const days = Math.ceil(D.list.length / n);
  let grid = "";
  for (let i=0;i<days;i++){ const chunk = D.list.slice(i*n,(i+1)*n); const k = chunk.filter(s=>S.learned[s.id]).length;
    const cls = k===chunk.length ? "done" : k>0 ? "part" : ""; grid += `<span class="${cls}" title="Day ${i+1}: ${k}/${chunk.length}">${i+1}</span>`; }
  h += `<div class="card stack"><div class="seg" role="group">${CATS.map(x=>`<button data-pc="${x.key}" aria-pressed="${x.key===progCat}">${x.ko}</button>`).join("")}</div>
    <div class="row between"><b>Day 지도</b><span class="muted mono" style="font-size:12px">${learnedIn(c.key)} / ${D.list.length}</span></div>
    <div class="daygrid">${grid}</div>
    <div class="legend"><span style="background:var(--accent)"></span> 완료 <span style="background:var(--accent-soft);margin-left:8px"></span> 진행 중 <span style="background:var(--sunken);margin-left:8px"></span> 예정 · 하루 ${n}문장 기준</div>
    <div class="stack" style="gap:6px;margin-top:4px">${D.sections.map(sec => {
      const its = sec.patterns.flatMap(p=>p.items), k = its.filter(s=>S.learned[s.id]).length, p = Math.round(k/its.length*100);
      return `<div class="stack" style="gap:4px"><div class="row between" style="font-size:13px"><span>${esc(sec.name)}</span><span class="muted mono">${k}/${its.length}</span></div><div class="bar" style="height:6px"><i style="width:${p}%"></i></div></div>`; }).join("")}</div></div>`;
  const log = S.sessions.slice().reverse().slice(0,30);
  h += `<div class="card stack"><b>완료한 Day</b>${log.length ? `<div class="log">${log.map(x => {
    const cc = CATS.find(c=>c.key===x.cat); return `<div><span class="check">${ICON.check}</span><span><b>${cc?cc.ko:x.cat} Day ${x.day}</b> <span class="muted" style="font-size:12px">· 새 문장 ${x.n}개</span></span><span class="muted mono" style="font-size:12px">${x.date.slice(5).replace("-","/")}</span></div>`; }).join("")}</div>`
    : `<div class="empty">아직 완료한 Day가 없어요. 학습 탭에서 Day 1을 시작해 보세요.</div>`}</div></div>`;
  return h;
}

function viewPatterns(){
  const D = DATA[patCat];

  let h = topBar("문장 목록");
  h += `<div class="stack"><div class="seg" role="group">${CATS.map(x=>`<button data-pt="${x.key}" aria-pressed="${x.key===patCat}">${x.ko}</button>`).join("")}</div>

  let body = "";

      block += `<details class="pat" data-pi="${p.idx}" ${q || (openPat && openPat.cat===patCat && openPat.idx===p.idx) ?'open':''}><summary><span class="pt">${esc(p.p)}</span><span class="dots">${p.items.map(s=>`<i class="${S.learned[s.id]?'on':''}"></i>`).join("")}</span><span class="pk">${esc(p.k)}</span></summary>

  return h;

function stopSpeech(){ if (TTS.ok) try { speechSynthesis.cancel(); } catch(e){} }
function exMark(i){ exCur = i; document.querySelectorAll("#exlist .ex, #sheet .ex").forEach((el,k) => el.classList.toggle("cur", k === i)); }
window.addEventListener("hashchange", stopSpeech);
function setDaily(v){ S.settings.daily = clamp(parseInt(v,10)||1, 1, 50); save(); const i = $("#s-daily"); if (i) i.value = S.settings.daily; }
function bind(r){
  const app = $("#app");
  app.onclick = e => {
    const b = e.target.closest("button");
    if (!b) { const row = e.target.closest("[data-exi]"); if (row) row.classList.toggle("show"); return; }
    const d = b.dataset;
    if ("themeToggle" in d) { S.settings.theme = isDark() ? "light" : "dark"; save(); applyTheme(); render(); }
    else if (d.start) startLearn(d.start, DATA[d.start].list.length <= learnedIn(d.start) ? 0 : firstUnlearned(d.start));
    else if ("review" in d) startReview();
    else if (d.say) speak(BYID[d.say].en);
    else if (d.pc) { progCat = d.pc; render(); }
    else if (d.pt) { patCat = d.pt; render(); }
    else if (d.learnat != null) { openPat = { cat:patCat, idx:DATA[patCat].list[+d.learnat].pat.idx }; startLearn(patCat, +d.learnat, "patterns"); }
    else if (d.swapat != null) { openPat = { cat:patCat, idx:+d.swapat }; startSwapOnly(patCat, +d.swapat, "patterns"); }
    else if (d.exat != null) { openPat = { cat:patCat, idx:+d.exat }; backTo = "patterns"; exCat = patCat; exIdx = +d.exat; exCur = -1; location.hash = "#examples"; }
    else if ("back" in d) { stopSpeech(); location.hash = "#patterns"; }
    else if (d.ec) { exCat = d.ec; exIdx = 0; exCur = -1; stopSpeech(); render(); }
    else if (d.exh) { exHide = d.exh; render(); }
    else if (d.exsay != null) { const e = exPat().ex[+d.exsay]; exMark(+d.exsay); speak(e.en); }
    else if ("exall" in d) { const ex = exPat().ex || []; speakList(ex.map(e=>e.en), i => exMark(i), () => exMark(-1)); }
    else if ("exstop" in d) { stopSpeech(); exMark(-1); }
    else if ("exacc" in d) { S.settings.accent = S.settings.accent === "gb" ? "us" : "gb"; save(); b.textContent = accLabel(); }
    else if ("exprev" in d) { exIdx--; exCur = -1; stopSpeech(); render(); }
    else if ("exnext" in d) { exIdx++; exCur = -1; stopSpeech(); render(); }
    else if ("learnex" in d) { stopSpeech(); startLearn(exCat, exPat().items[0].idx, "examples"); }
    else if ("dec" in d) setDaily(S.settings.daily - 1);
    else if ("inc" in d) setDaily(S.settings.daily + 1);
    else if (d.th) { S.settings.theme = d.th; save(); applyTheme(); render(); }
    else if (d.acc) { S.settings.accent = d.acc; save(); render(); speak("Hello! This is how I sound."); }
    else if ("test" in d) speak("Hi! I'm about to start my English practice.");
    else if ("backup" in d) {
      const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      const done = () => toast("백업 코드를 복사했어요");
      const fallback = () => { const ta = $("#restore"); ta.value = code; ta.select(); toast("코드를 아래 칸에 표시했어요. 길게 눌러 복사하세요"); };
      try { navigator.clipboard.writeText(code).then(done, fallback); } catch(err){ fallback(); }
    }
    else if ("restore" in d) {
      try { const o = JSON.parse(decodeURIComponent(escape(atob($("#restore").value.trim()))));
        if (!o || !o.learned) throw 0; S = normalize(o); save(); applyTheme(); toast("복원했어요"); render(); }
      catch(err){ toast("코드를 읽지 못했어요. 전체를 빠짐없이 붙여 넣었는지 확인하세요"); }
    }
    else if ("reset" in d) {
      if (d.armed) { const keep = S.settings; S = normalize({ settings:keep }); save(); toast("기록을 초기화했어요"); render(); }
      else { d.armed = "1"; b.textContent = "한 번 더 누르면 초기화돼요"; }
    }
  };
  if (r==="patterns") app.querySelectorAll("details.pat").forEach(el => el.addEventListener("toggle", () => { if (el.open) openPat = { cat:patCat, idx:+el.dataset.pi }; }));
  if (r==="examples"){ const sel = $("#ex-pat"); sel.onchange = () => { exIdx = +sel.value; exCur = -1; stopSpeech(); render(); }; }

let X = null;
const dr = () => $("#drill");
function openDrill(){ dr().hidden = false; document.body.style.overflow = "hidden"; }
const FROM_LABEL = { patterns:"문장 목록", examples:"예문" };
function closeBtn(){

function stepsFor(s){
  const st = ["listen","shadow"];
  if (s.en.split(" ").length >= 3) st.push("build");
  if (s.pat.sw && !X.subSeen.has(s.pat)) st.push("swap");
  st.push("recall");
  return st;
}
function startLearn(cat, pos, from){
  X = { mode:"learn", cat, pos, subSeen:new Set(), from: from || null };
  openDrill(); goTo(pos);
}
function goTo(pos){
  const list = DATA[X.cat].list;
  X.pos = clamp(pos, 0, list.length-1);
  const s = list[X.pos];
  X.steps = stepsFor(s); X.step = 0; X.round = 0; X.build = null; X.sw = null;
  if (X.from === "patterns") openPat = { cat:X.cat, idx:s.pat.idx };

}
function nextPatternIndex(){
  const list = DATA[X.cat].list, cur = list[X.pos].pat;

}

function startSwapOnly(cat, patIdx, from){

}
const curS = () => X.mode === "learn" ? DATA[X.cat].list[X.pos] : X.mode === "review" ? X.items[X.i] : null;

function highlight(s){
  const en = esc(s.en);
  const alts = s.pat.p.split("/").map(a => a.split("~")[0].replace(/[?.!]/g,"").trim()).filter(a => a.length >= 3);
  for (const a of alts){
    for (const key of [a, a.split(" ").slice(1).join(" ")]){
      if (key.length < 3) continue;
      const k = esc(key); const i = en.toLowerCase().indexOf(k.toLowerCase());
      if (i >= 0) return en.slice(0,i) + "<mark>" + en.slice(i, i+k.length) + "</mark>" + en.slice(i+k.length);
    }
  }
  return en;
}
function masked(en, round){
  return en.split(" ").map((w,i) => {
    const m = w.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9']*)$/); const [ , pre, core, post ] = m || ["", "", w, ""];
    if (round === 1) { if (i % 2 === 1 && core.length > 1) return esc(pre) + `<span class="mask">${esc(core)}</span>` + esc(post); return esc(w); }
    if (round === 2) { if (core.length <= 1) return esc(w); return esc(pre) + esc(core[0]) + `<span class="mask">${esc(core.slice(1))}</span>` + esc(post); }
    return esc(w);
  }).join(" ");
}

/* 바꿔 말하기 */
function swapCompose(sw, sel){
  let en = esc(sw.en), ko = esc(sw.ko), plainEn = sw.en;
  sw.slots.forEach((sl, i) => {
    const o = sl.opts[sel[i]];
    en = en.split(`{${i+1}}`).join(`<span class="slotw sc${i%3}">${esc(o.en)}</span>`);
    ko = ko.split(`{${i+1}}`).join(`<span class="slotw sc${i%3}">${esc(o.ko)}</span>`);
    plainEn = plainEn.split(`{${i+1}}`).join(o.en);
  });
  return { en, ko, plainEn };
}
function drawSwap(pat){
  if (!X.sw || X.sw.pat !== pat) X.sw = { pat, sel: pat.sw.slots.map(()=>0), made: new Map() };
  const W = X.sw, sw = pat.sw;
  const c = swapCompose(sw, W.sel);
  W.made.set(W.sel.join(","), c.plainEn);
  const n = W.made.size, need = SWAP_MIN;
  const ok = n >= need;
  const footLearn = `<button class="btn ghost" data-adv>건너뛰기</button><button class="btn" data-adv ${ok?'':'disabled'}>${ok ? '회상으로' : `${need - n}개 더 만들어 말해 보기`}</button>`;
  const footOnly = `<button class="btn block" data-close>${X.from==="patterns" ? (ok ? '완료 · 목록으로' : '목록으로 돌아가기') : (ok ? '완료' : '닫기')}</button>`;
  frame(`${patChip(pat)}
    <span class="eyebrow">아래 단어를 눌러 바꾸고, 바뀐 문장을 소리 내어 말해 보세요</span>
    <div class="big" id="swEn">${c.en}</div><div class="ko-line" id="swKo">${c.ko}</div>
    ${TTS.ok ? `<div class="audio-row"><button class="pill" data-swplay>${ICON.play} 듣기</button><button class="pill" data-swslow>${ICON.slow} 천천히</button>${accPill()}</div>` : ''}
    ${sw.slots.map((sl,i)=>`<div class="slot sc${i%3}"><span class="slot-l">${esc(sl.label)} 바꾸기</span><div class="opts">${sl.opts.map((o,j)=>`<button class="opt" data-sl="${i}" data-op="${j}" aria-pressed="${W.sel[i]===j}">${esc(o.en)}</button>`).join("")}</div></div>`).join("")}
    <div class="made"><span>만든 문장</span>${Array.from({length:need},(_,k)=>`<i class="${k<n?'on':''}"></i>`).join("")}<span class="mono">${n}개</span></div>
    <div class="madelist">${[...W.made.values()].slice(-4).reverse().map(t=>`<span class="en">${esc(t)}</span>`).join("")}</div>`,
    X.mode === "learn" ? footLearn : footOnly);
}

/* recall compare */
const CONTR = {"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","there's":"there is","what's":"what is","where's":"where is","who's":"who is","how's":"how is","don't":"do not","doesn't":"does not","didn't":"did not","can't":"cannot","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","haven't":"have not","hasn't":"has not","shouldn't":"should not","couldn't":"could not","wouldn't":"would not","i'll":"i will","you'll":"you will","we'll":"we will","it'll":"it will","i've":"i have","you've":"you have","we've":"we have","i'd":"i would","you'd":"you would","we'd":"we would"};
const norm = s => s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s-]/g," ").split(/\s+/).filter(Boolean).flatMap(w => (CONTR[w]||w).split(" "));
function compare(user, ans){
  const a = norm(ans), u = norm(user);
  const dp = Array.from({length:a.length+1},()=>new Array(u.length+1).fill(0));
  for (let i=a.length-1;i>=0;i--) for (let j=u.length-1;j>=0;j--) dp[i][j] = a[i]===u[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const hit = new Set(); let i=0,j=0; while (i<a.length && j<u.length){ if (a[i]===u[j]){ hit.add(i); i++; j++; } else if (dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  const extra = u.length - hit.size;
  const score = a.length ? Math.max(0, (hit.size - extra*0.5) / a.length) : 0;
  const disp = ans.split(" "); let k = 0; const marks = disp.map(w => { const parts = norm(w); const ok = parts.every((_,x)=>hit.has(k+x)); k += parts.length; return ok; });
  return { score, html: disp.map((w,x) => marks[x] ? esc(w) : `<span class="miss">${esc(w)}</span>`).join(" ") };
}
function revealRecall(){
  const s = curS(); const val = ($("#rin")||{}).value || "";
  let res, sug = null;

dr().addEventListener("click", e => {

  if ("exsheet" in d) return openExSheet(s.pat);
  if (d.shexsay != null) { exMark(+d.shexsay); return speak(s.pat.ex[+d.shexsay].en); }
  if ("shexall" in d) return speakList(s.pat.ex.map(e=>e.en), i => exMark(i), () => exMark(-1));
  if ("shexstop" in d) { stopSpeech(); return exMark(-1); }
  if (d.jump != null) { $("#sheet")?.remove(); return goTo(+d.jump); }
  if ("sheet" in d) return openSheet();
  if ("prev" in d) return goTo(X.pos - 1);
  if ("skip" in d) return goTo(X.pos + 1);
  if ("nextpat" in d) { const i = nextPatternIndex(); if (i >= 0) goTo(i); return; }
  if ("continue" in d) { X.clear = false; return nextSentence(); }
  if ("accflip" in d) { S.settings.accent = S.settings.accent === "gb" ? "us" : "gb"; save(); b.textContent = accLabel(); const t = X.mode==="swap"||X.steps?.[X.step]==="swap" ? swapCompose(X.sw.pat.sw, X.sw.sel).plainEn : s.en; return speak(t); }
  if ("play" in d) return speak(s.en);
  if ("slow" in d) return speak(s.en, .7);
  if ("playr" in d) return speak(s.en, [0.9,1][X.round]);
  if ("peek" in d) { b.classList.add("peek"); clearTimeout(b._t); b._t = setTimeout(()=>b.classList.remove("peek"), 1500); return; }
  if ("said" in d) { if (X.round < 1) { X.round++; return drawStep(); } return advance(); }
  if ("adv" in d) { if (X.steps[X.step] === "swap") X.subSeen.add(X.sw.pat); return advance(); }
  if (d.chip != null) { X.build.picked.push(+d.chip); b.classList.add("used"); return drawAnswer(); }
  if (d.ans != null) { const k = +d.ans; X.build.picked = X.build.picked.filter(x=>x!==k); dr().querySelector(`[data-chip="${k}"]`).classList.remove("used"); return drawAnswer(); }
  if ("clear" in d) { X.build.picked = []; dr().querySelectorAll(".chip.used").forEach(c=>c.classList.remove("used")); return drawAnswer(); }
  if ("hint" in d) { $("#hint").hidden = false; return; }
  if ("reveal" in d) return revealRecall();
  if (d.sl != null) { X.sw.sel[+d.sl] = +d.op; drawSwap(X.sw.pat); return speak(swapCompose(X.sw.pat.sw, X.sw.sel).plainEn); }
  if ("swplay" in d) return speak(swapCompose(X.sw.pat.sw, X.sw.sel).plainEn);
  if ("swslow" in d) return speak(swapCompose(X.sw.pat.sw, X.sw.sel).plainEn, .7);
  if (d.g != null) {
    const g = +d.g;
    if (X.mode === "learn") {
      const wasNew = !S.learned[s.id];
      grade(s.id, g); logActivity(1);
      if (wasNew) addNew(X.cat);
      const cleared = wasNew && checkClear(X.cat);
      save();
      if (cleared) return drawClear();
      return nextSentence();
    } else {
      grade(s.id, g); logActivity(1); save();
      X.i++; if (X.i >= X.items.length) { toast("오늘 복습 완료"); return closeDrill(); }
      return drawReview();
    }
  }
});

function drawAnswer(){
  const B = X.build, ans = $("#ans");
  ans.className = "answer";
  ans.innerHTML = B.picked.map(k => `<button class="chip" data-ans="${k}">${esc(B.words[B.order[k]])}</button>`).join("");
  if (B.picked.length === B.words.length){
    const built = B.picked.map(k => B.words[B.order[k]]).join(" ");
    if (built === B.words.join(" ")){
      ans.classList.add("ok"); speak(curS().en);
      dr().querySelector(".dr-foot .in").innerHTML = `<button class="btn block" data-adv>정답! ${NEXT_LABEL[X.steps[X.step+1]]}</button>`;
    } else {
      void ans.offsetWidth; ans.classList.add("no");
      const first = B.picked.findIndex((k,i) => B.words[B.order[k]] !== B.words[i]);
      const el = ans.children[first]; if (el) el.classList.add("wrong");
    }
  }
}

/* ---------- boot ---------- */
(async () => {
  $("#app").innerHTML = `<div class="wrap"><div class="empty">문장 불러오는 중…</div></div>`;
  try { await loadData(); render(); }
  catch(e){ $("#app").innerHTML = `<div class="wrap"><div class="card stack"><b>문장 데이터를 불러오지 못했어요</b><span class="muted">파일을 직접 열었다면 웹 서버(예: GitHub Pages)로 열어 주세요. 네트워크를 확인한 뒤 새로고침하세요.</span></div></div>`; }
})();
})();
</script>
